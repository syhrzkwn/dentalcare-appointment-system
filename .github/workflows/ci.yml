name: CI

# Runs on pull requests into master: when opened, reopened, or when new commits are pushed to them
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build WAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and package
        run: mvn -B package

  smoke-test:
    name: Docker smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create throwaway .env
        run: |
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_USER=dentalcare"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "ADMIN_EMAIL=admin@ci.test"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "ADMIN_SECRET_KEY=$(openssl rand -hex 16)"
          } > .env

      - name: Check production compose file
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Start app and database
        run: docker compose up -d --build --wait

      - name: Smoke test
        run: |
          set -a; . ./.env; set +a
          .github/scripts/smoke-test.sh http://localhost:8080

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and remove containers
        if: always()
        run: docker compose down -v
